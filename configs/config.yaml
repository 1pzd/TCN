data:
  bj_path: data/dataset_BJ_fixation_only.csv
  data_dir: data
  zj_path: data/dataset_ZJ_fixation_only.csv

model:
  max_seq_len: 200
  num_channels:
  - 32
  - 48
  - 64
  - 80
  - 96
  kernel_sizes:
  - 5
  - 5
  - 3
  - 3
  - 3
  dropout: 0.1
  feature_cols:
  - gaze_x
  - gaze_y
  - gaze_vel
  - gaze_vel_x
  - gaze_vel_y
  - gaze_acc
  - disp_x
  - disp_y
  min_clip_len: 10

training:
  batch_size: 32
  class_weight: null
  epochs: 100
  learning_rate: 8.0e-4
  weight_decay: 1.0e-5
  patience: 50
  test_subject_ratio: 0.2
  grad_clip: 1.0
  warmup_epochs: 10

vote:
  threshold: 0.5

random_state: 42
